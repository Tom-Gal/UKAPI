name: Verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Create test application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run backend tests and static analysis
        run: |
          php artisan test
          vendor/bin/phpstan analyse
          composer audit --locked --no-interaction

      - name: Run frontend checks and production build
        run: |
          npm run check
          npm run types:check
          npm run build

      - name: Validate OpenAPI and route cache
        run: |
          php -r 'require "vendor/autoload.php"; Symfony\Component\Yaml\Yaml::parseFile("openapi/openapi.yaml");'
          php artisan route:cache
          php artisan route:clear
