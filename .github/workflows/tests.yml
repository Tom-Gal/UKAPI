name: Verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4.24'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, pgsql, pdo_pgsql
          tools: composer:2.10.3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for backend tests
        run: npm run build

      - name: Create test application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check PHP formatting
        run: composer lint:check

      - name: Run PHP static analysis
        run: composer types:check

      - name: Run PHP tests
        id: php_tests
        continue-on-error: true
        run: |
          mkdir -p storage/test-results
          php artisan test --log-junit storage/test-results/phpunit.xml

      - name: Publish PHP test failure annotations
        if: always()
        env:
          PHP_TEST_OUTCOME: ${{ steps.php_tests.outcome }}
        run: |
          if [ -f storage/test-results/phpunit.xml ]; then
            php -r '
              $report = simplexml_load_file($argv[1]);
              if ($report === false) {
                  fwrite(STDERR, "::error title=PHPUnit report::Could not parse PHPUnit JUnit output.\n");
                  exit(1);
              }

              $failures = $report->xpath("//testcase[failure or error]") ?: [];
              foreach ($failures as $failure) {
                  $class = (string) $failure["class"];
                  $name = (string) $failure["name"];
                  fwrite(STDERR, "::error title=PHPUnit failure::{$class}::{$name}\n");
              }
            ' storage/test-results/phpunit.xml
          else
            echo "::error title=PHPUnit report::PHPUnit did not produce a JUnit report."
          fi

          test "$PHP_TEST_OUTCOME" = success

      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Run frontend checks
        run: |
          npm run check
          npm run types:check

      - name: Validate OpenAPI and route cache
        run: |
          php -r 'require "vendor/autoload.php"; Symfony\Component\Yaml\Yaml::parseFile("openapi/openapi.yaml");'
          php artisan route:cache
          php artisan route:clear
