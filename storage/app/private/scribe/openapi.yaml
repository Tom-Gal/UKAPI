openapi: 3.1.0
info:
  title: 'UKAPI.io API reference'
  description: 'A focused, interactive reference for every live UKAPI.io v1 endpoint.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'Postcodes & location'
    description: "\nCanonical UK postcode, nearby-postcode and coordinate lookup data from Postcodes.io."
  -
    name: 'Companies & SIC'
    description: "\nSimplified Companies House profiles, officers and filing metadata with predictable pagination."
  -
    name: 'Crime data'
    description: "\nApproximate, anonymised street-level crime data from Police.uk. Coverage is England, Wales and Northern Ireland; Scotland includes British Transport Police data only."
  -
    name: 'Flood monitoring'
    description: "\nNear-real-time England flood warnings, stations and readings from the Environment Agency. This data is not an emergency alert service."
  -
    name: VAT
    description: "\nDeterministic VAT calculations for GBP amounts. Calculations are provided for convenience and are not tax advice."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Create a test or live key in your <a href="/api-keys">dashboard</a>, then send <code>Authorization: Bearer {YOUR_API_KEY}</code>. Keys are shown only when created and should never be placed in client-side code.'
security:
  -
    default: []
paths:
  '/v1/postcodes/{postcode}':
    get:
      summary: 'Look up a postcode.'
      operationId: lookUpAPostcode
      description: 'Returns a normalised UK postcode and selected geographic references.'
      parameters: []
      responses:
        200:
          description: 'Postcode found'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      postcode:
                        type: string
                        examples:
                          - 'BL2 6XX'
                      country:
                        type: string
                        examples:
                          - England
                      region:
                        type: string
                        examples:
                          - 'North West'
                      latitude:
                        type: number
                        examples:
                          - 53.5922
                      longitude:
                        type: number
                        examples:
                          - -2.4117
                      local_authority:
                        type: object
                        properties:
                          name:
                            type: string
                            examples:
                              - Bolton
                          code:
                            type: string
                            examples:
                              - E08000001
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                      cached:
                        type: boolean
                        examples:
                          - false
                      source:
                        type: string
                        examples:
                          - postcodes_io
                      coverage:
                        type: string
                        examples:
                          - UK
                examples:
                  -
                    data:
                      postcode: 'BL2 6XX'
                      country: England
                      region: 'North West'
                      latitude: 53.5922
                      longitude: -2.4117
                      local_authority:
                        name: Bolton
                        code: E08000001
                    meta:
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
                      cached: false
                      source: postcodes_io
                      coverage: UK
        401:
          description: 'Missing, invalid or revoked API key'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - invalid_api_key
                      message:
                        type: string
                        examples:
                          - 'The API key is invalid.'
                      status:
                        type: integer
                        examples:
                          - 401
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: invalid_api_key
                      message: 'The API key is invalid.'
                      status: 401
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
        429:
          description: 'Burst limit or monthly quota reached'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - rate_limit_exceeded
                      message:
                        type: string
                        examples:
                          - 'Too many requests. Please retry shortly.'
                      status:
                        type: integer
                        examples:
                          - 429
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: rate_limit_exceeded
                      message: 'Too many requests. Please retry shortly.'
                      status: 429
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
      tags:
        - 'Postcodes & location'
    parameters:
      -
        in: path
        name: postcode
        description: 'UK postcode to look up. Spacing and case are normalised.'
        required: true
        schema:
          type: string
          examples:
            - 'BL2 6XX'
  '/v1/postcodes/{postcode}/validate':
    get:
      summary: 'Validate a postcode.'
      operationId: validateAPostcode
      description: 'Checks whether a normalised UK postcode has a provider record.'
      parameters: []
      responses:
        200:
          description: 'Postcode validation result'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      postcode:
                        type: string
                        examples:
                          - 'BL2 6XX'
                      valid:
                        type: boolean
                        examples:
                          - true
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                      cached:
                        type: boolean
                        examples:
                          - true
                      source:
                        type: string
                        examples:
                          - postcodes_io
                      coverage:
                        type: string
                        examples:
                          - UK
                examples:
                  -
                    data:
                      postcode: 'BL2 6XX'
                      valid: true
                    meta:
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
                      cached: true
                      source: postcodes_io
                      coverage: UK
        401:
          description: 'Missing, invalid or revoked API key'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - invalid_api_key
                      message:
                        type: string
                        examples:
                          - 'The API key is invalid.'
                      status:
                        type: integer
                        examples:
                          - 401
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: invalid_api_key
                      message: 'The API key is invalid.'
                      status: 401
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
        429:
          description: 'Burst limit or monthly quota reached'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - rate_limit_exceeded
                      message:
                        type: string
                        examples:
                          - 'Too many requests. Please retry shortly.'
                      status:
                        type: integer
                        examples:
                          - 429
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: rate_limit_exceeded
                      message: 'Too many requests. Please retry shortly.'
                      status: 429
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
      tags:
        - 'Postcodes & location'
    parameters:
      -
        in: path
        name: postcode
        description: 'UK postcode to validate. Spacing and case are normalised.'
        required: true
        schema:
          type: string
          examples:
            - 'BL2 6XX'
  '/v1/postcodes/{postcode}/nearby':
    get:
      summary: 'Find nearby postcodes.'
      operationId: findNearbyPostcodes
      description: 'Results are ordered by distance in metres.'
      parameters:
        -
          in: query
          name: limit
          description: 'Number of results to return, from 1 to 100. Defaults to 10. Must be between 1 and 100.'
          required: false
          schema:
            type: integer
            description: 'Number of results to return, from 1 to 100. Defaults to 10. Must be between 1 and 100.'
            examples:
              - 5
        -
          in: query
          name: radius
          description: 'Search radius in metres, from 1 to 2,000. Defaults to 100. Must be between 1 and 2000.'
          required: false
          schema:
            type: integer
            description: 'Search radius in metres, from 1 to 2,000. Defaults to 100. Must be between 1 and 2000.'
            examples:
              - 500
      responses:
        200:
          description: 'Nearby postcodes'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      postcode:
                        type: string
                        examples:
                          - 'BL2 6XX'
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            postcode:
                              type: string
                              examples:
                                - 'BL2 6XY'
                            distance_metres:
                              type: number
                              examples:
                                - 152.4
                            latitude:
                              type: number
                              examples:
                                - 53.5931
                            longitude:
                              type: number
                              examples:
                                - -2.4108
                        examples:
                          -
                            -
                              postcode: 'BL2 6XY'
                              distance_metres: 152.4
                              latitude: 53.5931
                              longitude: -2.4108
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                      cached:
                        type: boolean
                        examples:
                          - false
                      source:
                        type: string
                        examples:
                          - postcodes_io
                      coverage:
                        type: string
                        examples:
                          - UK
                examples:
                  -
                    data:
                      postcode: 'BL2 6XX'
                      results:
                        -
                          postcode: 'BL2 6XY'
                          distance_metres: 152.4
                          latitude: 53.5931
                          longitude: -2.4108
                    meta:
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
                      cached: false
                      source: postcodes_io
                      coverage: UK
        401:
          description: 'Missing, invalid or revoked API key'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - invalid_api_key
                      message:
                        type: string
                        examples:
                          - 'The API key is invalid.'
                      status:
                        type: integer
                        examples:
                          - 401
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: invalid_api_key
                      message: 'The API key is invalid.'
                      status: 401
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
        429:
          description: 'Burst limit or monthly quota reached'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - rate_limit_exceeded
                      message:
                        type: string
                        examples:
                          - 'Too many requests. Please retry shortly.'
                      status:
                        type: integer
                        examples:
                          - 429
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: rate_limit_exceeded
                      message: 'Too many requests. Please retry shortly.'
                      status: 429
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
      tags:
        - 'Postcodes & location'
    parameters:
      -
        in: path
        name: postcode
        description: 'UK postcode used as the search origin.'
        required: true
        schema:
          type: string
          examples:
            - 'BL2 6XX'
  '/v1/coordinates/{latitude}/{longitude}/postcode':
    get:
      summary: 'Reverse geocode coordinates.'
      operationId: reverseGeocodeCoordinates
      description: 'Returns the nearest UK postcode for WGS84 coordinates.'
      parameters: []
      responses:
        200:
          description: 'Nearest postcode'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      postcode:
                        type: string
                        examples:
                          - 'BL2 6XX'
                      country:
                        type: string
                        examples:
                          - England
                      latitude:
                        type: number
                        examples:
                          - 53.5922
                      longitude:
                        type: number
                        examples:
                          - -2.4117
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                      cached:
                        type: boolean
                        examples:
                          - false
                      source:
                        type: string
                        examples:
                          - postcodes_io
                      coverage:
                        type: string
                        examples:
                          - UK
                examples:
                  -
                    data:
                      postcode: 'BL2 6XX'
                      country: England
                      latitude: 53.5922
                      longitude: -2.4117
                    meta:
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
                      cached: false
                      source: postcodes_io
                      coverage: UK
        401:
          description: 'Missing, invalid or revoked API key'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - invalid_api_key
                      message:
                        type: string
                        examples:
                          - 'The API key is invalid.'
                      status:
                        type: integer
                        examples:
                          - 401
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: invalid_api_key
                      message: 'The API key is invalid.'
                      status: 401
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
        429:
          description: 'Burst limit or monthly quota reached'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - rate_limit_exceeded
                      message:
                        type: string
                        examples:
                          - 'Too many requests. Please retry shortly.'
                      status:
                        type: integer
                        examples:
                          - 429
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: rate_limit_exceeded
                      message: 'Too many requests. Please retry shortly.'
                      status: 429
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
      tags:
        - 'Postcodes & location'
    parameters:
      -
        in: path
        name: latitude
        description: 'WGS84 latitude from -90 to 90.'
        required: true
        schema:
          type: number
          examples:
            - 53.5922
      -
        in: path
        name: longitude
        description: 'WGS84 longitude from -180 to 180.'
        required: true
        schema:
          type: number
          examples:
            - -2.4117
  /v1/companies/search:
    get:
      summary: 'Search companies.'
      operationId: searchCompanies
      description: 'Searches Companies House company records by name.'
      parameters:
        -
          in: query
          name: q
          description: 'Company name search text, between 2 and 200 characters. Must be at least 2 characters. Must not be greater than 200 characters.'
          required: true
          schema:
            type: string
            description: 'Company name search text, between 2 and 200 characters. Must be at least 2 characters. Must not be greater than 200 characters.'
            examples:
              - 'example technology'
        -
          in: query
          name: page
          description: 'One-based result page. Defaults to 1. Must be at least 1.'
          required: false
          schema:
            type: integer
            description: 'One-based result page. Defaults to 1. Must be at least 1.'
            examples:
              - 1
        -
          in: query
          name: per_page
          description: 'Results to return per page, from 1 to 100. Defaults to 25. Must be between 1 and 100.'
          required: false
          schema:
            type: integer
            description: 'Results to return per page, from 1 to 100. Defaults to 25. Must be between 1 and 100.'
            examples:
              - 25
      responses:
        200:
          description: 'Paginated company search results'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        company_number:
                          type: string
                          examples:
                            - SC012345
                        name:
                          type: string
                          examples:
                            - 'Example Technology Ltd'
                        status:
                          type: string
                          examples:
                            - active
                        type:
                          type: string
                          examples:
                            - ltd
                    examples:
                      -
                        -
                          company_number: SC012345
                          name: 'Example Technology Ltd'
                          status: active
                          type: ltd
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                      cached:
                        type: boolean
                        examples:
                          - false
                      stale:
                        type: boolean
                        examples:
                          - false
                      source:
                        type: string
                        examples:
                          - companies_house
                      coverage:
                        type: string
                        examples:
                          - UK
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            examples:
                              - 1
                          per_page:
                            type: integer
                            examples:
                              - 25
                          total:
                            type: integer
                            examples:
                              - 42
                examples:
                  -
                    data:
                      -
                        company_number: SC012345
                        name: 'Example Technology Ltd'
                        status: active
                        type: ltd
                    meta:
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
                      cached: false
                      stale: false
                      source: companies_house
                      coverage: UK
                      pagination:
                        page: 1
                        per_page: 25
                        total: 42
        401:
          description: 'Missing, invalid or revoked API key'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - invalid_api_key
                      message:
                        type: string
                        examples:
                          - 'The API key is invalid.'
                      status:
                        type: integer
                        examples:
                          - 401
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: invalid_api_key
                      message: 'The API key is invalid.'
                      status: 401
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
        503:
          description: 'Companies House is temporarily unavailable'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - upstream_unavailable
                      message:
                        type: string
                        examples:
                          - 'The upstream data provider is temporarily unavailable. Please retry shortly.'
                      status:
                        type: integer
                        examples:
                          - 503
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: upstream_unavailable
                      message: 'The upstream data provider is temporarily unavailable. Please retry shortly.'
                      status: 503
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
      tags:
        - 'Companies & SIC'
  '/v1/companies/{companyNumber}':
    get:
      summary: 'Look up a company.'
      operationId: lookUpACompany
      description: 'Returns a simplified Companies House company profile.'
      parameters: []
      responses:
        200:
          description: 'Company profile'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      company_number:
                        type: string
                        examples:
                          - SC012345
                      name:
                        type: string
                        examples:
                          - 'Example Technology Ltd'
                      status:
                        type: string
                        examples:
                          - active
                      type:
                        type: string
                        examples:
                          - ltd
                      jurisdiction:
                        type: string
                        examples:
                          - scotland
                      incorporated_on:
                        type: string
                        examples:
                          - '2019-04-12'
                      sic_codes:
                        type: array
                        items:
                          type: string
                        examples:
                          -
                            - '62012'
                            - '63110'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                      cached:
                        type: boolean
                        examples:
                          - false
                      stale:
                        type: boolean
                        examples:
                          - false
                      source:
                        type: string
                        examples:
                          - companies_house
                      coverage:
                        type: string
                        examples:
                          - UK
                examples:
                  -
                    data:
                      company_number: SC012345
                      name: 'Example Technology Ltd'
                      status: active
                      type: ltd
                      jurisdiction: scotland
                      incorporated_on: '2019-04-12'
                      sic_codes:
                        - '62012'
                        - '63110'
                    meta:
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
                      cached: false
                      stale: false
                      source: companies_house
                      coverage: UK
        401:
          description: 'Missing, invalid or revoked API key'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - invalid_api_key
                      message:
                        type: string
                        examples:
                          - 'The API key is invalid.'
                      status:
                        type: integer
                        examples:
                          - 401
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: invalid_api_key
                      message: 'The API key is invalid.'
                      status: 401
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
        503:
          description: 'Companies House is temporarily unavailable'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        examples:
                          - upstream_unavailable
                      message:
                        type: string
                        examples:
                          - 'The upstream data provider is temporarily unavailable. Please retry shortly.'
                      status:
                        type: integer
                        examples:
                          - 503
                      request_id:
                        type: string
                        examples:
                          - req_01j8d5s1wdm85crh9b739hw4gd
                examples:
                  -
                    error:
                      code: upstream_unavailable
                      message: 'The upstream data provider is temporarily unavailable. Please retry shortly.'
                      status: 503
                      request_id: req_01j8d5s1wdm85crh9b739hw4gd
      tags:
        - 'Companies & SIC'
    parameters:
      -
        in: path
        name: companyNumber
        description: 'Companies House company number. Whitespace is removed and letters are uppercased.'
        required: true
        schema:
          type: string
          examples:
            - SC012345
  '/v1/companies/{companyNumber}/officers':
    get:
      summary: 'List company officers.'
      operationId: listCompanyOfficers
      description: "Returns a company's officers without date-of-birth data."
      parameters:
        -
          in: query
          name: page
          description: 'One-based result page. Defaults to 1. Must be at least 1.'
          required: false
          schema:
            type: integer
            description: 'One-based result page. Defaults to 1. Must be at least 1.'
            examples:
              - 1
        -
          in: query
          name: per_page
          description: 'Results to return per page, from 1 to 100. Defaults to 25. Must be between 1 and 100.'
          required: false
