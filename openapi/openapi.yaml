openapi: 3.1.0
info:
    title: UKApi.co.uk API
    version: 1.0.0
    description: |
        The UKApi.co.uk v1 contract. API keys are issued through the customer dashboard
        and must be supplied with the Bearer authentication scheme.
        All operations are read-only GET requests and are safe to retry. X-Request-Id
        is a correlation identifier; it does not deduplicate requests or usage accounting.
        Monthly request quotas are hard limits shared by all API keys on an account,
        measured in UTC calendar months and reset at 00:00 UTC on the first day of each month.
        API keys may be restricted to endpoint families or allowed IP/CIDR ranges. A valid
        key that does not permit a request receives HTTP 403 with error.code
        api_key_scope_forbidden or api_key_ip_not_allowed. Test and live prefixes are
        operational labels and currently use the same data, limits, and billing.
        When durable usage accounting is unavailable, requests fail closed with HTTP 503
        and error.code usage_unavailable; no dataset is returned. Error responses use JSON,
        including for CSV downloads.
    x-ukapi-features:
        current_data:
            description: Current normalized data and calculations.
            plans: [free, hobby, pro, scale]
        historical_data:
            description: Historical snapshots and time-qualified data.
            plans: [pro, scale]
        change_feeds:
            description: Dataset change manifests and delivery feeds.
            plans: [pro, scale]
        commercial_use:
            description: Commercial application use under the applicable source licences.
            plans: [pro, scale]
        bulk_export:
            description: Synchronous CSV download of the small full condensed SIC reference dataset.
            plans: [scale]
servers:
    - url: https://api.ukapi.co.uk
      description: Production
security:
    - bearerApiKey: []
x-ukapi-runtime-headers: &ukapiRuntimeHeaders
    X-Request-Id:
        description: Correlation identifier echoed in the response envelope or error envelope.
        schema:
            type: string
    RateLimit-Limit:
        description: Per-key burst request limit for the current plan.
        schema:
            type: integer
    RateLimit-Remaining:
        description: Remaining per-key burst requests in the current one-second window.
        schema:
            type: integer
    RateLimit-Reset:
        description: Unix timestamp when the current per-key burst window resets.
        schema:
            type: integer
    X-Quota-Limit:
        description: Hard monthly request quota shared by the account.
        schema:
            type: integer
    X-Quota-Remaining:
        description: Remaining hard monthly requests for the account.
        schema:
            type: integer
    X-Quota-Reset:
        description: Unix timestamp of the next UTC calendar-month boundary.
        schema:
            type: integer
x-ukapi-rate-limit-headers: &ukapiRateLimitHeaders
    <<: *ukapiRuntimeHeaders
    Retry-After:
        description: Seconds before retrying the request.
        schema:
            type: integer
