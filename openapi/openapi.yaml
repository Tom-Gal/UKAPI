components:
    securitySchemes:
        bearerApiKey:
            type: http
            scheme: bearer
            bearerFormat: uk_live_k_<id>.<secret>
    parameters:
        MotRegistration:
            name: registration
            in: path
            required: true
            description: UK vehicle registration, with spaces omitted or included.
            schema:
                type: string
                minLength: 2
                maxLength: 8
                pattern: '^(?=.*[A-Za-z0-9])[A-Za-z0-9\s]{2,8}$'
        MotVin:
            name: vin
            in: path
            required: true
            description: 17-character vehicle identification number.
            schema:
                type: string
                minLength: 17
                maxLength: 17
                pattern: '^[A-HJ-NPR-Z0-9]{17}$'
        Amount:
            name: amount
            in: query
            required: true
            schema:
                type: string
                pattern: '^(?:0|[1-9]\d{0,11})(?:\.\d{1,2})?$'
            example: '100.00'
        Rate:
            name: rate
            in: query
            required: true
            schema:
                type: string
                pattern: '^(?:0|[1-9]\d{0,2})(?:\.\d{1,2})?$'
                x-ukapi-validation:
                    numeric_minimum: 0
                    numeric_maximum: 100
            example: '20.00'
        Postcode:
            name: postcode
            in: path
            required: true
            description: A UK postcode. Letter case and whitespace are normalised.
            schema:
                type: string
            example: BL2 6XX
        CrimePostcode:
            name: postcode
            in: query
            required: true
            description: A UK postcode. Letter case and whitespace are normalised before resolving its coordinates.
            schema:
                type: string
                maxLength: 16
            example: BL2 6XX
        CrimeMonth:
            name: month
            in: query
            required: false
            description: A non-future month in YYYY-MM format. Omit for the latest available provider data.
            schema:
                type: string
                pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-07'
        CrimeSince:
            name: since
            in: query
            required: true
            description: The first non-future monthly snapshot to compare, in YYYY-MM format.
            schema:
                type: string
                pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-07'
        CrimeUntil:
            name: until
            in: query
            required: false
            description: The final non-future monthly snapshot to compare, in YYYY-MM format. Defaults to the latest completed month.
            schema:
                type: string
                pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-08'
        FloodPostcode:
            name: postcode
            in: query
            required: true
            description: A UK postcode. Letter case and whitespace are normalised before resolving its coordinates.
            schema:
                type: string
                maxLength: 16
            example: BL2 6XX
        FloodStationId:
            name: id
            in: path
            required: true
            description: Environment Agency station identifier. Only letters, numbers, hyphens and underscores are accepted.
            schema:
                type: string
                pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
            example: 5380TH
        SnapshotSince:
            name: since
            in: query
            required: true
            description: An immutable snapshot version returned by an earlier response.
            schema:
                type: string
                maxLength: 26
            example: 01J8SNAPSHOT00000000000000
        SnapshotUntil:
            name: until
            in: query
            required: false
            description: An immutable snapshot version. Omit to compare with the active snapshot.
            schema:
                type: string
                maxLength: 26
            example: 01J8SNAPSHOT00000000000001
        NearbyLimit:
            name: limit
            in: query
            required: false
            description: Number of results to return. Defaults to 10.
            schema:
                type: integer
                minimum: 1
                maximum: 100
            example: 5
        NearbyRadius:
            name: radius
            in: query
            required: false
            description: Search radius in metres. Defaults to 100.
            schema:
                type: integer
                minimum: 1
                maximum: 2000
            example: 500
        Latitude:
            name: latitude
            in: path
            required: true
            schema:
                type: number
                minimum: -90
                maximum: 90
            example: 53.5922
        Longitude:
            name: longitude
            in: path
            required: true
            schema:
                type: number
                minimum: -180
                maximum: 180
            example: -2.4117
        CompanyNumber:
            name: companyNumber
            in: path
            required: true
            description: Companies House company number. Whitespace is removed and letters are uppercased.
            schema:
                type: string
                minLength: 1
                maxLength: 8
                pattern: '^(?=.*\d)[A-Za-z0-9]{1,8}$'
            example: SC012345
        CompanyQuery:
            name: q
            in: query
            required: true
            description: Company-name query.
            schema:
                type: string
                minLength: 2
                maxLength: 200
            example: example
        SicCode:
            name: code
            in: path
            required: true
            description: A five-digit Companies House condensed SIC 2007 code. Whitespace is removed.
            schema:
                type: string
                minLength: 5
                maxLength: 5
                pattern: '^\d{5}$'
            example: '62012'
        SicQuery:
            name: q
            in: query
            required: true
            description: SIC code or description search text.
            schema:
                type: string
                minLength: 2
                maxLength: 200
            example: software
        Page:
            name: page
            in: query
            required: false
            description: One-based result page. Defaults to 1.
            schema:
                type: integer
                minimum: 1
                maximum: 10000
            example: 1
        PerPage:
            name: per_page
            in: query
            required: false
            description: Results per page. Defaults to 25.
            schema:
                type: integer
                minimum: 1
                maximum: 100
                x-ukapi-plan-bound: max_page_size
            example: 25
        FoodEstablishmentId:
            name: id
            in: path
            required: true
            description: Positive Food Standards Agency food establishment identifier.
            schema:
                type: string
                pattern: '^[1-9]\d{0,9}$'
            example: '123456'
        FoodSearchName:
            name: name
            in: query
            required: false
            description: Business name search text. Required when postcode is omitted.
            schema:
                type: string
                minLength: 2
                maxLength: 200
            example: Example Kitchen
        FoodSearchPostcode:
            name: postcode
            in: query
            required: false
            description: UK postcode. Required for nearby searches and required for ordinary searches when name is omitted.
            schema:
                type: string
                maxLength: 16
            example: BL2 6XX
        FoodNearbyPostcode:
            name: postcode
            in: query
            required: true
            description: UK postcode used to resolve the nearby-search origin.
            schema:
                type: string
                maxLength: 16
            example: BL2 6XX
        FoodNearbyRadius:
            name: radius
            in: query
            required: true
            description: Nearby search radius in kilometres.
            schema:
                type: integer
                minimum: 1
                maximum: 25
            example: 5
        FoodScheme:
            name: scheme
            in: query
            required: false
            description: Food hygiene scheme to search. FHRS covers England, Wales and Northern Ireland; FHIS covers Scotland.
            schema:
                type: string
                enum: [FHRS, FHIS]
            example: FHRS
        FoodRating:
            name: rating
            in: query
            required: false
            description: FHRS numeric rating or an FHIS status value.
            schema:
                type: string
                enum:
                    [
                        '0',
                        '1',
                        '2',
                        '3',
                        '4',
                        '5',
                        Pass,
                        ImprovementRequired,
                        AwaitingPublication,
                        AwaitingInspection,
                        Exempt,
                    ]
            example: '5'
        FoodRatingOperator:
            name: rating_operator
            in: query
            required: false
            description: Comparison operator for ratings. It applies to numeric FHRS ratings.
            schema:
                type: string
                enum: [Equal, GreaterThanOrEqual, LessThanOrEqual]
            example: Equal
        PlanningPostcode:
            name: postcode
            in: query
            required: false
            description: England postcode. Use this or the latitude and longitude pair.
            schema:
                type: string
                maxLength: 16
            example: BL2 6XX
        PlanningLatitude:
            name: lat
            in: query
            required: false
            description: WGS84 latitude. Required with lng when postcode is omitted.
            schema:
                type: number
                minimum: -90
                maximum: 90
            example: 53.5922
        PlanningLongitude:
            name: lng
            in: query
            required: false
            description: WGS84 longitude. Required with lat when postcode is omitted.
            schema:
                type: number
                minimum: -180
                maximum: 180
            example: -2.4117
        PlanningLimit:
            name: limit
            in: query
            required: false
            description: Maximum number of constraints to return. Defaults to 50.
            schema:
                type: integer
                minimum: 1
                maximum: 100
            example: 25
        Outcode:
            name: outcode
            in: path
            required: true
            description: A UK postcode outward code such as BL2 or SW1A.
            schema:
                type: string
                pattern: '^(?:GIR0|[A-PR-UWYZ][A-Z]?\d{1,2}[A-Z]?)$'
            example: BL2
        CouncilCode:
            name: code
            in: path
            required: true
            description: Nine-character GSS local authority district code.
            schema:
                type: string
                pattern: '^[A-Z]\d{8}$'
            example: E08000001
        BankHolidayDivision:
            name: division
            in: path
            required: true
            description: UK bank-holiday division.
            schema:
                type: string
                enum: [england-and-wales, scotland, northern-ireland]
            example: england-and-wales
        WorkingDaysFrom:
            name: from
            in: query
            required: true
            description: Inclusive start date in YYYY-MM-DD format.
            schema:
                type: string
                pattern: '^\d{4}-\d{2}-\d{2}$'
                format: date
            example: '2026-04-01'
        WorkingDaysTo:
            name: to
            in: query
            required: true
            description: Inclusive end date in YYYY-MM-DD format, no more than 366 calendar days after from.
            schema:
                type: string
                pattern: '^\d{4}-\d{2}-\d{2}$'
                format: date
            example: '2026-04-30'
        WorkingDaysDivision:
            name: division
            in: query
            required: true
            description: UK bank-holiday division used to exclude public holidays.
            schema:
                type: string
                enum: [england-and-wales, scotland, northern-ireland]
            example: england-and-wales
        TaxYear:
            name: year
            in: path
            required: true
            description: Four-digit tax-year start year, such as 2026 for 2026-27.
            schema:
                type: string
                pattern: '^\d{4}$'
            example: '2026'
    responses:
        InvalidApiKey:
            description: Missing, malformed, invalid, or revoked API key.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
        Forbidden:
            description: The requested feature is not included in the current plan, or the API key scope/IP policy does not permit the request.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
        InvalidParameter:
            description: One or more query parameters are invalid.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
        RateLimited:
            description: The per-key burst limit or hard account-wide UTC calendar-month quota has been reached.
            headers: *ukapiRateLimitHeaders
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
        NotFound:
            description: No geography record was found for the supplied value.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
        UpstreamUnavailable:
            description: The source provider is temporarily unavailable.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
        UpstreamInvalidResponse:
            description: The source provider returned a response that does not match the expected shape.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
        UsageUnavailable:
            description: Durable usage accounting is unavailable. Requests fail closed with error.code usage_unavailable and no dataset is returned.
            headers:
                Retry-After:
                    schema:
                        type: integer
                        example: 30
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
        SicReferenceUnavailable:
            description: The local SIC reference snapshot is temporarily unavailable.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorEnvelope'
